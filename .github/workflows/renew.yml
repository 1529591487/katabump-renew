name: Katabump Auto Renew

on:
  schedule:
    # 初始默认触发时间，后续运行结束时会被自动覆盖改写为具体的“日 月”
    - cron: '57 3 12 6 *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    # 全局挂载具有 workflow 权限的 PAT
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        # 运行并将日志实时输出到控制台，同时重定向保存到 renew.log 供后续 Python 步骤解析
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js 2>&1 | tee renew.log

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/

# ================= 动态自适应时间调整 =================
    - name: Dynamic Post Processing
      if: always() 
      run: |
        python3 -c "
        import glob, os, random, re, sys, datetime

        log_file = 'renew.log'
        is_success = False
        parsed_date = None

        # 建立英文月份映射字典，兼容全称与缩写
        months_map = {
            'jan': 1, 'feb': 2, 'mar': 3, 'apr': 4, 'may': 5, 'jun': 6,
            'jul': 7, 'aug': 8, 'sep': 9, 'oct': 10, 'nov': 11, 'dec': 12,
            'january': 1, 'february': 2, 'march': 3, 'april': 4, 'june': 6,
            'july': 7, 'august': 8, 'september': 9, 'october': 10, 'november': 11, 'december': 12
        }

        if os.path.exists(log_file):
            with open(log_file, 'r', encoding='utf-8') as f:
                log_content = f.read()
                
                # 1. 检查是否显式成功
                if '续期成功！' in log_content:
                    is_success = True
                
                # 2. 尝试从日志中捕获具体的下一次可续期时间
                # 匹配 '下次可续期: 12 June' 或 '下次可续期:12 Jun' 等格式
                date_match = re.search(r'下次可续期:\s*(\d+)\s*([A-Za-z]+)', log_content)
                if date_match:
                    try:
                        d = int(date_match.group(1))
                        m_str = date_match.group(2).lower()
                        m = months_map.get(m_str)
                        if m:
                            now = datetime.datetime.utcnow()
                            y = now.year
                            # 处理跨年边界情况（例如当前12月，下次续期在1月）
                            if m == 1 and now.month == 12:
                                y += 1
                            parsed_date = datetime.datetime(y, m, d)
                    except Exception as e:
                        print(f'解析预留日期失败: {e}')
        else:
            print('未找到运行日志，采用默认兜底策略。')

        # 3. 核心时间决策树
        if parsed_date:
            print(f'【结果】成功提取到日志中的明确续期日期: {parsed_date.strftime(\"%Y-%m-%d\")}')
            next_date = parsed_date
        elif is_success:
            print('【结果】续期成功，默认 3 天后再次执行。')
            next_date = datetime.datetime.utcnow() + datetime.timedelta(days=3)
        else:
            print('【结果】未成功且无明确日期指示，设定 1 天后（明天）重试。')
            next_date = datetime.datetime.utcnow() + datetime.timedelta(days=1)

        # 4. 生成随机时间点并计算 Cron (格式: 分 时 日 月 周)
        rand_min = random.randint(0, 59)
        rand_hour = random.randint(0, 23)
        new_cron = f'- cron: \'{rand_min} {rand_hour} {next_date.day} {next_date.month} *\''
        print(f'下一次触发时间 (UTC): {next_date.strftime(\"%Y-%m-%d\")} {rand_hour}:{rand_min}')
        print(f'生成的 Cron 表达式: {new_cron}')

        # 5. 定位并更新工作流文件
        workflow_file = None
        for f in glob.glob('.github/workflows/*.yml'):
            with open(f, 'r', encoding='utf-8') as fh:
                if 'name: Katabump Auto Renew' in fh.read():
                    workflow_file = f
                    break

        if not workflow_file:
            print('未找到对应的工作流文件')
            sys.exit(1)

        with open(workflow_file, 'r', encoding='utf-8') as fh:
            content = fh.read()

        updated_content = re.sub(r'- cron:\s*[\'\"].*?[\'\"]', new_cron, content)

        with open(workflow_file, 'w', encoding='utf-8') as fh:
            fh.write(updated_content)
        "

        # 6. 将工作流变更同步推送到 GitHub 仓库
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .github/workflows/*.yml
        
        if git commit -m "chore: dynamic schedule update [skip ci]"; then
          git push origin HEAD:${{ github.ref }}
          echo "成功同步下一次触发状态至仓库。"
        else
          echo "无状态变更，跳过推送。"
        fi
