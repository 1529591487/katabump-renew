- name: Randomize Next Cron
      if: always() 
      run: |
        # 1. 自动定位当前工作流文件
        WORKFLOW_FILE=$(grep -l "name: Katabump Auto Renew" .github/workflows/*.yml | head -n 1)
        if [ -z "$WORKFLOW_FILE" ]; then
          echo "未找到对应的工作流文件，请检查 name 是否匹配"
          exit 1
        fi
        echo "正在处理文件: $WORKFLOW_FILE"

        # 2. 生成随机时间 (UTC 时间：小时 0-23，分钟 0-59)
        RAND_MIN=$((RANDOM % 60))
        RAND_HOUR=$((RANDOM % 24))
        NEW_CRON="$RAND_MIN $RAND_HOUR * * *"
        echo "生成的下一次触发时间 (CRON): $NEW_CRON"

        # 3. 使用稳定定界符进行替换，避免硬编码单双引号嵌套
        sed -i -E "s#\- cron:.*#- cron: '$NEW_CRON'#g" "$WORKFLOW_FILE"

        # 4. 配置 Git 并推送到仓库
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "$WORKFLOW_FILE"
        
        if git commit -m "chore: randomize next cron to $NEW_CRON UTC [skip ci]"; then
          git push origin HEAD:${{ github.ref }}
          echo "成功更新下一次触发时间。"
        else
          echo "无文件变更，跳过推送。"
        fi
