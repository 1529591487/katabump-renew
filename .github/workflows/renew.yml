name: Katabump Auto Renew

on:
  schedule:
    # 初始默认触发时间（北京时间 12:30），后续运行结束时会被自动覆盖改写
    - cron: '29 6 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    # 全局挂载具有 workflow 权限的 PAT
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/

# ================= 动态随机下一次执行时间 =================
    - name: Randomize Next Cron
      if: always() 
      run: |
        # 1. 自动定位当前工作流文件
        WORKFLOW_FILE=$(grep -l "name: Katabump Auto Renew" .github/workflows/*.yml | head -n 1)
        if [ -z "$WORKFLOW_FILE" ]; then
          echo "未找到对应的工作流文件，请检查 name 是否匹配"
          exit 1
        fi
        echo "正在处理文件: $WORKFLOW_FILE"

        # 2. 纯数字计算，不使用任何复杂的字符串和引号包裹
        RAND_MIN=$(( RANDOM % 60 ))
        RAND_HOUR=$(( RANDOM % 24 ))
        
        # 3. 使用 printf 格式化表达式，完全避开双引号引起的 EOF 错误
        # 这会生成类似 - cron: '54 0 * * *' 的标准行
        TARGET_LINE=$(printf -- "- cron: '%d %d * * *'" $RAND_MIN $RAND_HOUR)
        echo "即将替换为: $TARGET_LINE"

        # 4. 精准匹配旧的 cron 行并直接平替
        sed -i -E "s#\- cron:.*#$TARGET_LINE#g" "$WORKFLOW_FILE"

        # 5. 配置 Git 并推送到仓库
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "$WORKFLOW_FILE"
        
        if git commit -m "chore: randomize next cron [skip ci]"; then
          git push origin HEAD:${{ github.ref }}
          echo "成功更新下一次触发时间并推送到仓库。"
        else
          echo "无文件变更，跳过推送。"
        fi
