name: Katabump Auto Renew

on:
  schedule:
    # 初始默认触发时间（北京时间 12:30），后续运行结束时会被自动覆盖改写
    - cron: '30 4 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    # 【修改点 1】在这里直接挂载你的 PAT。这样后续所有的 Git 操作都会自动、安全地复用该凭证
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/

# ================= 动态随机下一次执行时间 =================
    - name: Randomize Next Cron
      if: always() 
      run: |
        # 1. 自动定位当前工作流文件
        WORKFLOW_FILE=$(grep -l "name: Katabump Auto Renew" .github/workflows/*.yml | head -n 1)
        if [ -z "$WORKFLOW_FILE" ]; then
          echo "未找到对应的工作流文件，请检查 name 是否匹配"
          exit 1
        fi
        echo "正在处理文件: $WORKFLOW_FILE"

        # 2. 生成随机时间 (UTC 时间：小时 0-23，分钟 0-59)
        RAND_MIN=$((RANDOM % 60))
        RAND_HOUR=$((RANDOM % 24))
        NEW_CRON="    - cron: '$RAND_MIN $RAND_HOUR * * *'"
        echo "生成的下一次触发时间 (UTC): $RAND_HOUR:$RAND_MIN"

        # 3. 使用 sed 替换已有的 cron 行
        sed -i "s/.*- cron:.*/$NEW_CRON/" "$WORKFLOW_FILE"

        # 4. 配置 Git 并推送到仓库
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "$WORKFLOW_FILE"
        
        # [skip ci] 用于防止部分仓库配置了 push 触发导致死循环
        git commit -m "chore: randomize next cron to $RAND_HOUR:$RAND_MIN UTC [skip ci]" || echo "无文件变更"
        
        # 【修改点 2】由于 checkout 已经全局托管了 PAT 凭证，此处直接安全推送即可，无需在 URL 中拼接明文 Token
        git push origin HEAD:${{ github.ref }}
