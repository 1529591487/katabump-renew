name: Katabump Auto Renew

on:
  schedule:
    # 初始默认触发时间（北京时间 12:30），后续运行结束时会被自动覆盖改写
    - cron: '30 4 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/

    # ================= 动态随机下一次执行时间 =================
    - name: Randomize Next Cron
      if: always() 
      uses: grbnb/random-workflows-cron@v2
      with:
        github_token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
        keep_history: true  # 保持历史提交记录干净，不堆积无意义的 commit message
        time_zone: 'UTC+8'  # 设定参考时区（北京时间）
        hour_start: 0       # 允许随机的开始小时（北京时间 0 点）
        hour_end: 23        # 允许随机的结束小时（北京时间 23 点）
        interval_count: 1   # 每天执行的频次
