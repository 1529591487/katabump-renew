name: Katabump Auto Renew

on:
  schedule:
    # 初始默认触发时间，后续运行结束时会被自动覆盖改写为具体的“日 月”
    - cron: '29 6 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    # 全局挂载具有 workflow 权限的 PAT
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        # 运行并将日志实时输出到控制台，同时重定向保存到 renew.log 供后续 Python 步骤解析
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js 2>&1 | tee renew.log

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/

# ================= 动态自适应时间调整 =================
    - name: Dynamic Post Processing
      if: always() 
      run: |
        python3 -c "
        import glob, os, random, re, sys, datetime

        # 1. 解析日志，判断是否续期成功
        log_file = 'renew.log'
        is_success = False
        if os.path.exists(log_file):
            with open(log_file, 'r', encoding='utf-8') as f:
                log_content = f.read()
                if '续期成功！' in log_content:
                    is_success = True
        else:
            print('未找到运行日志，默认按未成功处理。')

        # 2. 根据结果动态决定间隔天数
        if is_success:
            print('【结果】检测到续期成功！设定 3 天后再次执行。')
            days_to_add = 3
        else:
            print('【结果】未成功续期（或暂无法续期），设定 1 天后（明天）重试。')
            days_to_add = 1

        # 3. 基于 UTC 时间计算精确的下一次触发日期与随机时间点
        next_date = datetime.datetime.utcnow() + datetime.timedelta(days=days_to_add)
        rand_min = random.randint(0, 59)
        rand_hour = random.randint(0, 23)
        
        # 构造指定“日”和“月”的 Cron 表达式: 分 时 日 月 周
        new_cron = f'- cron: \'{rand_min} {rand_hour} {next_date.day} {next_date.month} *\''
        print(f'动态计算完成。下一次触发时间 (UTC): {next_date.strftime(\"%Y-%m-%d\")} {rand_hour}:{rand_min}')
        print(f'生成的 Cron 表达式: {new_cron}')

        # 4. 定位工作流文件并重写
        workflow_file = None
        for f in glob.glob('.github/workflows/*.yml'):
            with open(f, 'r', encoding='utf-8') as fh:
                if 'name: Katabump Auto Renew' in fh.read():
                    workflow_file = f
                    break

        if not workflow_file:
            print('未找到对应的工作流文件')
            sys.exit(1)

        with open(workflow_file, 'r', encoding='utf-8') as fh:
            content = fh.read()

        updated_content = re.sub(r'- cron:\s*[\'\"].*?[\'\"]', new_cron, content)

        with open(workflow_file, 'w', encoding='utf-8') as fh:
            fh.write(updated_content)
        "

        # 5. 将工作流变更同步推送到 GitHub 仓库
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add .github/workflows/*.yml
        
        if git commit -m "chore: dynamic schedule update [skip ci]"; then
          git push origin HEAD:${{ github.ref }}
          echo "成功同步下一次触发状态至仓库。"
        else
          echo "无状态变更，跳过推送。"
        fi
