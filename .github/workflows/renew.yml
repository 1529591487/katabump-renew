name: Katabump Auto Renew

on:
  schedule:
    # 初始默认触发时间（北京时间 12:30），后续运行结束时会被自动覆盖改写
    - cron: '29 6 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    # 全局挂载具有 workflow 权限的 PAT
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/

# ================= 动态随机下一次执行时间 =================
    - name: Randomize Next Cron
      if: always() 
      run: |
        python3 -c "
        import glob, random, re, sys

        # 1. 定位工作流文件
        files = glob.glob('.github/workflows/*.yml')
        workflow_file = None
        for f in files:
            with open(f, 'r', encoding='utf-8') as fh:
                if 'name: Katabump Auto Renew' in fh.read():
                    workflow_file = f
                    break

        if not workflow_file:
            print('未找到对应的工作流文件')
            sys.exit(1)
        print(f'正在处理文件: {workflow_file}')

        # 2. 生成随机时间
        rand_min = random.randint(0, 59)
        rand_hour = random.randint(0, 23)
        new_cron = f'- cron: \'{rand_min} {rand_hour} * * *\''
        print(f'生成的下一次触发时间: {new_cron}')

        # 3. 读取、替换并写回文件
        with open(workflow_file, 'r', encoding='utf-8') as fh:
            content = fh.read()

        # 使用正则精准替换旧的 cron 行
        updated_content = re.sub(r'- cron:\s*[\'\"].*?[\'\"]', new_cron, content)

        with open(workflow_file, 'w', encoding='utf-8') as fh:
            fh.write(updated_content)
        "

        # 4. 配置 Git 并推送到仓库
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .github/workflows/*.yml
        
        if git commit -m "chore: randomize next cron [skip ci]"; then
          git push origin HEAD:${{ github.ref }}
          echo "成功更新下一次触发时间并推送到仓库。"
        else
          echo "无文件变更，跳过推送。"
        fi
